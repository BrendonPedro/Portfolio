<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" shape-rendering="crispEdges">
  <!-- sky bands -->
  <rect x="0" y="0" width="320" height="60" fill="#ffb347"/>
  <rect x="0" y="60" width="320" height="40" fill="#ff9a5c"/>
  <rect x="0" y="100" width="320" height="30" fill="#ff7e6b"/>
  <!-- sun -->
  <rect x="248" y="24" width="28" height="28" fill="#fff2b0"/>
  <rect x="244" y="28" width="36" height="20" fill="#fff2b0"/>
  <rect x="252" y="20" width="20" height="36" fill="#fff2b0"/>
  <!-- Table Mountain (flat top!) -->
  <g fill="#5a4a7a">
    <rect x="40" y="78" width="240" height="52" />
    <rect x="24" y="94" width="16" height="36" />
    <rect x="280" y="94" width="16" height="36" />
    <rect x="8" y="110" width="16" height="20" />
    <rect x="296" y="110" width="16" height="20" />
  </g>
  <g fill="#463a61">
    <rect x="40" y="78" width="240" height="6" />
    <rect x="72" y="96" width="10" height="34" />
    <rect x="150" y="90" width="8" height="40" />
    <rect x="228" y="98" width="10" height="32" />
  </g>
  <!-- tablecloth cloud spilling over -->
  <g fill="#f4eef7">
    <rect x="90" y="72" width="70" height="8"/>
    <rect x="100" y="66" width="46" height="8"/>
    <rect x="96" y="80" width="20" height="8"/>
  </g>
  <!-- sea -->
  <rect x="0" y="130" width="320" height="70" fill="#2b6cb0"/>
  <rect x="0" y="130" width="320" height="6" fill="#4c8fd6"/>
  <g fill="#7fb8ea">
    <rect x="24" y="150" width="26" height="4"/>
    <rect x="120" y="162" width="30" height="4"/>
    <rect x="230" y="148" width="26" height="4"/>
    <rect x="70" y="178" width="26" height="4"/>
    <rect x="180" y="184" width="30" height="4"/>
  </g>
  <!-- speech bubble -->
  <g>
    <rect x="26" y="18" width="120" height="44" fill="#ffffff"/>
    <rect x="22" y="22" width="128" height="36" fill="#ffffff"/>
    <rect x="46" y="62" width="10" height="8" fill="#ffffff"/>
    <rect x="40" y="70" width="8" height="6" fill="#ffffff"/>
    <text x="86" y="48" text-anchor="middle" font-family="'Courier New',monospace" font-weight="bold" font-size="26" fill="#1a1a2e">AWEH!</text>
  </g>
  <text x="160" y="196" text-anchor="middle" font-family="'Courier New',monospace" font-weight="bold" font-size="11" fill="#dce9f7">CAPE TOWN SLANG TRANSLATOR</text>
</svg>
