<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" shape-rendering="crispEdges">
  <!-- night market sky -->
  <rect x="0" y="0" width="320" height="200" fill="#1a1030"/>
  <rect x="0" y="0" width="320" height="8" fill="#120a22"/>
  <!-- lanterns -->
  <g>
    <rect x="28" y="14" width="2" height="10" fill="#6b5a9e"/>
    <rect x="22" y="24" width="14" height="16" fill="#e84545"/>
    <rect x="24" y="26" width="4" height="12" fill="#ff7a5c"/>
    <rect x="26" y="40" width="6" height="3" fill="#ffd23e"/>
    <rect x="284" y="10" width="2" height="10" fill="#6b5a9e"/>
    <rect x="278" y="20" width="14" height="16" fill="#e84545"/>
    <rect x="280" y="22" width="4" height="12" fill="#ff7a5c"/>
    <rect x="282" y="36" width="6" height="3" fill="#ffd23e"/>
  </g>
  <!-- phone scanning a menu -->
  <g>
    <!-- menu card (traditional chinese) -->
    <rect x="36" y="58" width="104" height="112" fill="#f4e8c8"/>
    <rect x="36" y="58" width="104" height="14" fill="#c73e3e"/>
    <text x="88" y="70" text-anchor="middle" font-family="'Noto Sans TC','PingFang TC',sans-serif" font-weight="bold" font-size="11" fill="#fff">菜單</text>
    <g font-family="'Noto Sans TC','PingFang TC',sans-serif" font-size="11" fill="#3a2a2a">
      <text x="44" y="92">牛肉麵</text>
      <text x="44" y="112">滷肉飯</text>
      <text x="44" y="132">珍珠奶茶</text>
      <text x="44" y="152">小籠包</text>
    </g>
    <g fill="#8a7a5a">
      <rect x="108" y="84" width="24" height="3"/>
      <rect x="108" y="104" width="24" height="3"/>
      <rect x="108" y="124" width="24" height="3"/>
      <rect x="108" y="144" width="24" height="3"/>
    </g>
    <!-- translation beam -->
    <g fill="#4ade4a">
      <rect x="146" y="106" width="24" height="4"/>
      <rect x="166" y="100" width="6" height="16"/>
      <rect x="172" y="104" width="6" height="8"/>
    </g>
    <!-- phone with translated menu -->
    <rect x="186" y="52" width="98" height="126" rx="0" fill="#20242e"/>
    <rect x="192" y="60" width="86" height="104" fill="#0f1e38"/>
    <rect x="192" y="60" width="86" height="12" fill="#2456c8"/>
    <text x="235" y="70" text-anchor="middle" font-family="'Courier New',monospace" font-weight="bold" font-size="9" fill="#fff">CEMTA</text>
    <g font-family="'Courier New',monospace" font-weight="bold" font-size="9" fill="#7fd4ff">
      <text x="197" y="88">Beef Noodles</text>
      <text x="197" y="112">Braised Pork</text>
      <text x="197" y="136">Bubble Tea</text>
      <text x="197" y="158">Soup Dumplings</text>
    </g>
    <g font-family="'Courier New',monospace" font-size="7" fill="#8a9ab8">
      <text x="197" y="97">niu rou mian</text>
      <text x="197" y="121">lu rou fan</text>
      <text x="197" y="145">zhen zhu nai cha</text>
    </g>
    <rect x="228" y="168" width="14" height="4" fill="#4a5468"/>
  </g>
  <text x="160" y="192" text-anchor="middle" font-family="'Courier New',monospace" font-weight="bold" font-size="11" fill="#dce9f7">CEMTA — MENUS, TRANSLATED</text>
</svg>
